<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片晃動與超連結範例</title>
    <!-- 引入指定的 CSS 檔案：U1558002.css -->
    <link rel="stylesheet" href="U1558002.css">
</head>
<body>

    <header>
        <h1>精選圖片展示區</h1>
        <p>將滑鼠移到圖片上試試看！點擊可開啟新網站。</p>
    </header>

    <!-- 5 張圖片展示區 -->
    <main class="gallery-container">
        <!-- 圖片 1 -->
        <a href="https://www.google.com" target="_blank" rel="noopener noreferrer" class="img-card">
            <img src="https://picsum.photos/300/200?random=1" alt="範例圖片 1">
            <span class="img-title">Google</span>
        </a>

        <!-- 圖片 2 -->
        <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer" class="img-card">
            <img src="https://picsum.photos/300/200?random=2" alt="範例圖片 2">
            <span class="img-title">YouTube</span>
        </a>

        <!-- 圖片 3 -->
        <a href="https://www.wikipedia.org" target="_blank" rel="noopener noreferrer" class="img-card">
            <img src="https://picsum.photos/300/200?random=3" alt="範例圖片 3">
            <span class="img-title">維基百科</span>
        </a>

        <!-- 圖片 4 -->
        <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="img-card">
            <img src="https://picsum.photos/300/200?random=4" alt="範例圖片 4">
            <span class="img-title">GitHub</span>
        </a>

        <!-- 圖片 5 -->
        <a href="https://www.apple.com" target="_blank" rel="noopener noreferrer" class="img-card">
            <img src="https://picsum.photos/300/200?random=5" alt="範例圖片 5">
            <span class="img-title">Apple</span>
        </a>
    </main>

    <footer>
        <p>&copy; 2026 Image Gallery Demo. All rights reserved.</p>
    </footer>

</body>
</html>
